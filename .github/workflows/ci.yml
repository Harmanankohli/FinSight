name: CI

on:
  push:
    branches: ["main", "refactor/**", "auth-**", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uvx ruff check .

  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv venv .venv
      - run: uv pip install -e ".[dev]"
      - run: uv run mypy src/shared src/orchestrator

  test:
    name: Unit tests (AUTH_ENABLED=${{ matrix.auth }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        auth: ["false", "true"]
    env:
      LLM_API_KEY: test-key
      LLM_BASE_URL: http://localhost:1234/v1
      LANGFUSE_PUBLIC_KEY: pk-lf-test
      LANGFUSE_SECRET_KEY: sk-lf-test
      REPORTS_OFFLINE: "true"
      AUTH_ENABLED: ${{ matrix.auth }}
      AUTH_JWT_SECRETS: ${{ matrix.auth == 'true' && 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' || '' }}
      SERVICE_AUTH_TOKEN: ${{ matrix.auth == 'true' && 'bbbbbbbbbbbbbbbb' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv venv .venv
      - run: uv pip install -e ".[test,orchestrator,rag,quant,market,analytics,reviewer,mcp_server]"
      - name: Run unit tests
        run: .venv/bin/python -m pytest src/tests/unit -m "not integration and not external and not openapi" -q
        timeout-minutes: 5

  frontend:
    name: Frontend (lint + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web/nextjs-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/web/nextjs-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  openapi:
    name: OpenAPI spec check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv venv .venv
      - run: uv pip install -e ".[dev]"
      - run: uv run python src/scripts/generate_openapi.py --check
      - run: uv run pytest -m "not integration and not external" -m openapi

  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        service:
          - name: orchestrator
            context: src/orchestrator
          - name: rag-agent
            context: src/financial_rag
          - name: quant-agent
            context: src/quant
          - name: market-agent
            context: src/market_context
          - name: analytics-agent
            context: src/analytics
          - name: reviewer-agent
            context: src/reviewer
          - name: mcp-server
            context: src/mcp_tools
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service.name }}
        run: docker build -t finsight-${{ matrix.service.name }}:ci -f ${{ matrix.service.context }}/Dockerfile .
