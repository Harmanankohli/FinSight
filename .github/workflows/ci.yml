name: CI

on:
  push:
    branches: ["main", "refactor/**", "auth-**", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uvx ruff check .

  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv venv .venv
      - run: uv pip install -e ".[dev]"
      - run: uv run mypy shared agent_1_adk

  test:
    name: Unit tests (AUTH_ENABLED=${{ matrix.auth }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        auth: ["false", "true"]
    env:
      LLM_API_KEY: test-key
      LLM_BASE_URL: http://localhost:1234/v1
      LANGFUSE_PUBLIC_KEY: pk-lf-test
      LANGFUSE_SECRET_KEY: sk-lf-test
      REPORTS_OFFLINE: "true"
      AUTH_ENABLED: ${{ matrix.auth }}
      AUTH_JWT_SECRETS: ${{ matrix.auth == 'true' && 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' || '' }}
      SERVICE_AUTH_TOKEN: ${{ matrix.auth == 'true' && 'bbbbbbbbbbbbbbbb' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv venv .venv
      - run: uv pip install -e ".[dev]"
      - run: uv run pytest -m "not integration and not external and not openapi" --cov=shared --cov=agent_1_adk --cov-report=xml -q
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  frontend:
    name: Frontend (lint + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/nextjs-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/nextjs-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  openapi:
    name: OpenAPI spec check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv venv .venv
      - run: uv pip install -e ".[dev]"
      - run: uv run python scripts/generate_openapi.py --check
      - run: uv run pytest -m "not integration and not external" -m openapi

  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    continue-on-error: true  # tracking issue: WP 1.8 will fix and make required
    strategy:
      matrix:
        service:
          - name: orchestrator
            context: agent_1_adk
          - name: rag-agent
            context: agent_2_llamaindex
          - name: quant-agent
            context: agent_3_langgraph
          - name: market-agent
            context: agent_4_crewai
          - name: mcp-server
            context: mcp_servers
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service.name }}
        run: docker build -t finsight-${{ matrix.service.name }}:ci -f ${{ matrix.service.context }}/Dockerfile .
