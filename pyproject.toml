[project]
name = "multi-agent-investment-system"
version = "0.1.0"
description = "Autonomous Investment Research & Portfolio Advisory System"
requires-python = ">=3.11"

dependencies = [
    # A2A Protocol
    "a2a-sdk[http-server]>=1.0.0",

    # Agent Frameworks
    "google-adk>=0.1.0",
    "llama-index>=0.10.0",
    "llama-index-vector-stores-pinecone>=0.1.0",
    "llama-index-embeddings-bedrock>=0.1.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "langsmith>=0.1.0",
    "crewai>=0.40.0",

    # API / Server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # MCP
    "mcp>=1.0.0",

    # Data / Finance
    "yfinance>=0.2.40",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.14.0",

    # NLP / Sentiment
    "vaderSentiment>=3.3.2",
    "transformers>=4.45.0",

    # Observability
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp>=1.28.0",

    # Storage
    "redis>=5.2.0",
    "psycopg2-binary>=2.9.0",
    "boto3>=1.35.0",

    # UI
    "streamlit>=1.39.0",
    "jinja2>=3.1.0",

    # Utils
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "pygments>=2.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
