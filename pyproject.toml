[tool.setuptools.packages.find]
where = ["src"]
include = [
    "shared*",
    "orchestrator*",
    "financial_rag*",
    "quant*",
    "market_context*",
    "analytics*",
    "reviewer*",
    "mcp_tools*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "S", "B", "C4", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/shared/**/*.py" = ["S110", "BLE001"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# Relaxed — enforce typed signatures but allow untyped internals
[[tool.mypy.overrides]]
module = [
    "financial_rag.*",
    "quant.*",
    "market_context.*",
    "analytics.*",
    "reviewer.*",
    "mcp_tools.*",
]
disallow_untyped_defs = false
ignore_errors = true

# Orchestrator gets stricter checking
[[tool.mypy.overrides]]
module = ["orchestrator.*"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["src/tests"]
pythonpath = ["src"]
markers = [
    "integration: marks tests requiring live services (deselect with -m 'not integration')",
    "external: marks tests that make real network calls",
    "auth: marks tests covering authentication and authorization",
    "openapi: marks the OpenAPI spec regeneration test",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "def __repr__",
    "if __name__ == .__main__.:",
]
fail_under = 70  # minimum coverage threshold

[tool.coverage.paths]
source = ["src"]

