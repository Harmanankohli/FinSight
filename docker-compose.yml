services:
  orchestrator:
    build:
      context: .
      dockerfile: src/orchestrator/Dockerfile
    ports: ["8001:8001"]
    env_file: .env
    environment:
      - AGENT_LLAMAINDEX_URL=http://financial-rag:8002
      - AGENT_LANGGRAPH_URL=http://quant:8003
      - AGENT_CREWAI_URL=http://market-context:8004
      - AGENT_SEED_URLS=http://financial-rag:8002,http://quant:8003,http://market-context:8004,http://analytics:8005,http://reviewer:8006
      - MCP_SERVER_URL=http://mcp:8010/sse
      - SEMANTIC_CACHE_ENABLED=false
      - FINSIGHT_DB_PATH=/data/finsight_memory.db
    volumes:
      - finsight_memory:/data
    depends_on:
      financial-rag:
        condition: service_healthy
      quant:
        condition: service_healthy
      market-context:
        condition: service_healthy
      analytics:
        condition: service_healthy
      reviewer:
        condition: service_healthy
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  financial-rag:
    build:
      context: .
      dockerfile: src/financial_rag/Dockerfile
    ports: ["8002:8002"]
    env_file: .env
    environment:
      - CHROMA_DIR=/data/chroma
      - MCP_SERVER_URL=http://mcp:8010/sse
    volumes:
      - chroma_data:/data/chroma
    depends_on:
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  quant:
    build:
      context: .
      dockerfile: src/quant/Dockerfile
    ports: ["8003:8003"]
    env_file: .env
    environment:
      - MCP_SERVER_URL=http://mcp:8010/sse
    depends_on:
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  market-context:
    build:
      context: .
      dockerfile: src/market_context/Dockerfile
    ports: ["8004:8004"]
    env_file: .env
    environment:
      - MCP_SERVER_URL=http://mcp:8010/sse
    depends_on:
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  analytics:
    build:
      context: .
      dockerfile: src/analytics/Dockerfile
    ports: ["8005:8005"]
    env_file: .env
    environment:
      - MCP_SERVER_URL=http://mcp:8010/sse
    depends_on:
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  reviewer:
    build:
      context: .
      dockerfile: src/reviewer/Dockerfile
    ports: ["8006:8006"]
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: src/mcp_tools/Dockerfile
    ports: ["8010:8010"]
    env_file: .env
    environment:
      - MCP_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: src/web/nextjs-app
      dockerfile: Dockerfile
    ports: ["3000:3000"]
    environment:
      - NEXT_PUBLIC_ORCHESTRATOR_URL=http://orchestrator:8001
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-finsight_dev}"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-finsight_dev}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  chroma_data:
  finsight_memory:
  redis_data:
